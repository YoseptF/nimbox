name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'YoseptF/nimbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish a release for the version in package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          awk -v v="$version" '$0 == "## " v {found=1; next} /^## / && found {exit} found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "nimbox $version" --notes-file "$RUNNER_TEMP/notes.md"
